<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Insta Focus</title>
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #666; --line: #e5e5e5; --accent: #d62976; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33; }
    }
    body { margin: 0; width: 280px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 16px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    label small { display: block; color: var(--muted); font-size: 12px; }
    input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
    footer { padding: 10px 16px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Insta Focus</h1>
    <p>Messages and posts. No Reels.</p>
  </header>
  <label>
    <span>Filter active<small>Turn everything off for now</small></span>
    <input type="checkbox" id="enabled" />
  </label>
  <label>
    <span>Block single reels<small>Includes reels people send you in DMs</small></span>
    <input type="checkbox" id="blockSharedReels" />
  </label>
  <label>
    <span>Hide Explore<small>Explore is mostly Reels</small></span>
    <input type="checkbox" id="hideExplore" />
  </label>
  <footer>The Reels tab and Reels feed are always hidden while the filter is active.</footer>
  <script src="popup.js"></script>
</body>
</html>
